<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="A luxury tower rendered in gold line art">
<title>A luxury tower rendered in gold line art</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1c17"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="600"><stop offset="0" stop-color="#f4e8c8"/><stop offset=".45" stop-color="#d2b980"/><stop offset="1" stop-color="#8d6f44"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e2bb"/><stop offset="1" stop-color="#9c7b4b"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2eee6" stop-opacity=".1"/><stop offset="1" stop-color="#f2eee6" stop-opacity=".02"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#0e0d0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d9c08a" stop-opacity=".42"/><stop offset=".55" stop-color="#c9b17d" stop-opacity=".1"/><stop offset="1" stop-color="#c9b17d" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#f2eee6" fill-opacity=".07"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<style>
.g{fill:none;stroke:url(#gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:1.2;opacity:.5}
.p{fill:url(#glass);stroke:url(#gold);stroke-opacity:.6;stroke-width:1.4}
.d{fill:#141310;stroke:url(#gold);stroke-opacity:.7;stroke-width:1.4}
.gf{fill:url(#gold)}
.i{fill:#f2eee6}
.sp{fill:#f1e2bb}
.serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;fill:url(#gold)}
.float{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out -2.5s infinite}
.spin{transform-box:view-box;animation:spin 60s linear infinite}
.spinr{transform-box:view-box;animation:spin 90s linear reverse infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
.twinkle:nth-of-type(2n){animation-delay:-1.4s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
.pulse.b{animation-delay:-.9s}.pulse.c{animation-delay:-1.8s}
.draw{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 3.2s cubic-bezier(.2,.7,.2,1) .4s backwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="600" height="600" fill="url(#bg)"/>
<rect width="600" height="600" fill="url(#dots)"/>
<circle cx="300" cy="260" r="280" fill="url(#glow)" opacity="1"/>

<path d="M100 500 H500" class="g"/>
<path d="M240 500 V200 L300 120 L360 200 V500" fill="url(#goldV)" fill-opacity=".12" stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M300 120 V60" class="g"/><circle cx="300" cy="56" r="5" class="gf"/>
<path d="M160 500 V300 H240 M440 500 V330 H360" class="g t"/>
<rect x="262" y="230" width="14" height="20" rx="2" class="gf" opacity="0.9"/><rect x="262" y="270" width="14" height="20" rx="2" class="gf" opacity="0.5"/><rect x="262" y="310" width="14" height="20" rx="2" class="gf" opacity="0.8"/><rect x="262" y="350" width="14" height="20" rx="2" class="gf" opacity="0.35"/><rect x="262" y="390" width="14" height="20" rx="2" class="gf" opacity="0.7"/><rect x="262" y="430" width="14" height="20" rx="2" class="gf" opacity="0.5"/><rect x="293" y="230" width="14" height="20" rx="2" class="gf" opacity="0.9"/><rect x="293" y="270" width="14" height="20" rx="2" class="gf" opacity="0.5"/><rect x="293" y="310" width="14" height="20" rx="2" class="gf" opacity="0.8"/><rect x="293" y="350" width="14" height="20" rx="2" class="gf" opacity="0.35"/><rect x="293" y="390" width="14" height="20" rx="2" class="gf" opacity="0.7"/><rect x="293" y="430" width="14" height="20" rx="2" class="gf" opacity="0.5"/><rect x="324" y="230" width="14" height="20" rx="2" class="gf" opacity="0.9"/><rect x="324" y="270" width="14" height="20" rx="2" class="gf" opacity="0.5"/><rect x="324" y="310" width="14" height="20" rx="2" class="gf" opacity="0.8"/><rect x="324" y="350" width="14" height="20" rx="2" class="gf" opacity="0.35"/><rect x="324" y="390" width="14" height="20" rx="2" class="gf" opacity="0.7"/><rect x="324" y="430" width="14" height="20" rx="2" class="gf" opacity="0.5"/><rect x="180" y="330" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="180" y="370" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="180" y="410" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="180" y="450" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="208" y="330" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="208" y="370" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="208" y="410" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="208" y="450" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="380" y="360" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="380" y="400" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="380" y="440" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="408" y="360" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="408" y="400" width="12" height="16" rx="2" class="i" opacity=".25"/><rect x="408" y="440" width="12" height="16" rx="2" class="i" opacity=".25"/><path class="sp twinkle" d="M450 128 Q450 140 462 140 Q450 140 450 152 Q450 140 438 140 Q450 140 450 128Z"/><path class="sp twinkle" d="M150 172 Q150 180 158 180 Q150 180 150 188 Q150 180 142 180 Q150 180 150 172Z"/><path class="sp twinkle" d="M500 254 Q500 260 506 260 Q500 260 500 266 Q500 260 494 260 Q500 260 500 254Z"/>
</svg>
