<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Gold map pin rising above a stylised city map with a five-star review card">
<title>Gold map pin rising above a stylised city map with a five-star review card</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1c17"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="600"><stop offset="0" stop-color="#f4e8c8"/><stop offset=".45" stop-color="#d2b980"/><stop offset="1" stop-color="#8d6f44"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e2bb"/><stop offset="1" stop-color="#9c7b4b"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2eee6" stop-opacity=".1"/><stop offset="1" stop-color="#f2eee6" stop-opacity=".02"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#0e0d0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d9c08a" stop-opacity=".42"/><stop offset=".55" stop-color="#c9b17d" stop-opacity=".1"/><stop offset="1" stop-color="#c9b17d" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#f2eee6" fill-opacity=".07"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<style>
.g{fill:none;stroke:url(#gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:1.2;opacity:.5}
.p{fill:url(#glass);stroke:url(#gold);stroke-opacity:.6;stroke-width:1.4}
.d{fill:#141310;stroke:url(#gold);stroke-opacity:.7;stroke-width:1.4}
.gf{fill:url(#gold)}
.i{fill:#f2eee6}
.sp{fill:#f1e2bb}
.serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;fill:url(#gold)}
.float{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out -2.5s infinite}
.spin{transform-box:view-box;animation:spin 60s linear infinite}
.spinr{transform-box:view-box;animation:spin 90s linear reverse infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
.twinkle:nth-of-type(2n){animation-delay:-1.4s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
.pulse.b{animation-delay:-.9s}.pulse.c{animation-delay:-1.8s}
.draw{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 3.2s cubic-bezier(.2,.7,.2,1) .4s backwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="600" fill="url(#bg)"/>
<rect width="800" height="600" fill="url(#dots)"/>
<circle cx="420" cy="260" r="320" fill="url(#glow)" opacity="1"/>

<rect x="130" y="120" width="540" height="380" rx="26" class="p"/>
<path d="M130 300 C 300 255, 420 365, 670 285" class="g t" stroke-width="10" opacity=".18"/>
<path d="M130 300 C 300 255, 420 365, 670 285" class="g t"/>
<path d="M300 120 C 320 250, 260 380, 330 500" class="g t"/>
<path d="M500 120 L540 500" class="g t"/>
<path d="M130 420 C 260 430, 420 440, 670 400" class="g t" stroke-dasharray="4 8"/>
<rect x="170" y="160" width="90" height="70" rx="8" class="p" opacity=".7"/><rect x="345" y="160" width="120" height="60" rx="8" class="p" opacity=".7"/>
<rect x="565" y="150" width="70" height="90" rx="8" class="p" opacity=".7"/><rect x="170" y="340" width="100" height="56" rx="8" class="p" opacity=".7"/>
<circle cx="600" cy="350" r="34" class="p" opacity=".7"/>
<ellipse cx="420" cy="340" rx="44" ry="14" class="g pulse"/>
<ellipse cx="420" cy="340" rx="44" ry="14" class="g pulse b"/>
<ellipse cx="420" cy="340" rx="44" ry="14" class="g pulse c"/>
<ellipse cx="420" cy="340" rx="20" ry="6" class="gf" opacity=".5"/>
<g class="float">
<path filter="url(#shadow)" d="M420 338 C 420 338 346 258 346 214 A74 74 0 1 1 494 214 C 494 258 420 338 420 338 Z" class="gf"/>
<circle cx="420" cy="212" r="30" fill="#12110f"/>
<polygon points="420,194 432,208 420,230 408,208" class="gf"/>
</g>
<g filter="url(#shadow)"><rect x="530" y="378" width="190" height="80" rx="14" class="d"/></g>
<path class="gf" transform="translate(552 402)" d="M0 -7 L2 -2 L7.5 -2 L3.2 1.2 L4.8 6.5 L0 3.4 L-4.8 6.5 L-3.2 1.2 L-7.5 -2 L-2 -2Z"/><path class="gf" transform="translate(572 402)" d="M0 -7 L2 -2 L7.5 -2 L3.2 1.2 L4.8 6.5 L0 3.4 L-4.8 6.5 L-3.2 1.2 L-7.5 -2 L-2 -2Z"/><path class="gf" transform="translate(592 402)" d="M0 -7 L2 -2 L7.5 -2 L3.2 1.2 L4.8 6.5 L0 3.4 L-4.8 6.5 L-3.2 1.2 L-7.5 -2 L-2 -2Z"/><path class="gf" transform="translate(612 402)" d="M0 -7 L2 -2 L7.5 -2 L3.2 1.2 L4.8 6.5 L0 3.4 L-4.8 6.5 L-3.2 1.2 L-7.5 -2 L-2 -2Z"/><path class="gf" transform="translate(632 402)" d="M0 -7 L2 -2 L7.5 -2 L3.2 1.2 L4.8 6.5 L0 3.4 L-4.8 6.5 L-3.2 1.2 L-7.5 -2 L-2 -2Z"/>
<rect x="545" y="424" width="120" height="6" rx="3" class="i" opacity=".6"/><rect x="545" y="438" width="80" height="5" rx="2.5" class="i" opacity=".3"/>
<g filter="url(#shadow)"><rect x="90" y="72" width="270" height="48" rx="24" class="d"/></g>
<circle cx="120" cy="95" r="9" class="g"/><path d="M127 102 L134 109" class="g"/>
<rect x="148" y="91" width="150" height="7" rx="3.5" class="i" opacity=".5"/>
<path class="sp twinkle" d="M680 98 Q680 110 692 110 Q680 110 680 122 Q680 110 668 110 Q680 110 680 98Z"/><path class="sp twinkle" d="M100 512 Q100 520 108 520 Q100 520 100 528 Q100 520 92 520 Q100 520 100 512Z"/>

</svg>
