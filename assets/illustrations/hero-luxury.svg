<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Gold faceted diamond orbited by rings and a rising growth line">
<title>Gold faceted diamond orbited by rings and a rising growth line</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1c17"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="800"><stop offset="0" stop-color="#f4e8c8"/><stop offset=".45" stop-color="#d2b980"/><stop offset="1" stop-color="#8d6f44"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e2bb"/><stop offset="1" stop-color="#9c7b4b"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2eee6" stop-opacity=".1"/><stop offset="1" stop-color="#f2eee6" stop-opacity=".02"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#0e0d0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d9c08a" stop-opacity=".42"/><stop offset=".55" stop-color="#c9b17d" stop-opacity=".1"/><stop offset="1" stop-color="#c9b17d" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#f2eee6" fill-opacity=".07"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<style>
.g{fill:none;stroke:url(#gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:1.2;opacity:.5}
.p{fill:url(#glass);stroke:url(#gold);stroke-opacity:.6;stroke-width:1.4}
.d{fill:#141310;stroke:url(#gold);stroke-opacity:.7;stroke-width:1.4}
.gf{fill:url(#gold)}
.i{fill:#f2eee6}
.sp{fill:#f1e2bb}
.serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;fill:url(#gold)}
.float{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out -2.5s infinite}
.spin{transform-box:view-box;animation:spin 60s linear infinite}
.spinr{transform-box:view-box;animation:spin 90s linear reverse infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
.twinkle:nth-of-type(2n){animation-delay:-1.4s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
.pulse.b{animation-delay:-.9s}.pulse.c{animation-delay:-1.8s}
.draw{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 3.2s cubic-bezier(.2,.7,.2,1) .4s backwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="800" fill="url(#bg)"/>
<rect width="800" height="800" fill="url(#dots)"/>
<circle cx="400" cy="400" r="380" fill="url(#glow)" opacity="1"/><circle cx="400" cy="380" r="180" fill="url(#glow)" opacity="0.8"/>

<g class="spin" style="transform-origin:400px 400px">
  <circle cx="400" cy="400" r="340" class="g t" stroke-dasharray="2 12"/>
  <circle cx="740" cy="400" r="7" class="gf"/>
  <circle cx="60" cy="400" r="4" class="gf" opacity=".7"/>
</g>
<g class="spinr" style="transform-origin:400px 400px">
  <circle cx="400" cy="400" r="270" class="g t"/>
  <circle cx="400" cy="130" r="9" class="gf"/>
  <circle cx="400" cy="130" r="18" class="g t"/>
  <circle cx="209" cy="591" r="5" class="i" opacity=".7"/>
</g>
<circle cx="400" cy="400" r="200" class="g t" stroke-dasharray="1 7"/>
<path class="g draw" stroke-width="3" d="M90 640 C 220 610, 260 520, 340 520 S 470 470, 520 380 S 640 200, 700 150"/>
<path class="g" stroke-width="3" d="M672 146 L702 148 L698 178"/>
<ellipse cx="400" cy="610" rx="170" ry="22" fill="url(#glow)" opacity=".9"/>
<g class="float" filter="url(#shadow)"><polygon points="270,340 340,270 335,340" fill="url(#goldV)" fill-opacity="0.18" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="335,340 340,270 400,340" fill="url(#goldV)" fill-opacity="0.42" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="340,270 400,340 460,270" fill="url(#goldV)" fill-opacity="0.12" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="400,340 460,270 465,340" fill="url(#goldV)" fill-opacity="0.55" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="465,340 460,270 530,340" fill="url(#goldV)" fill-opacity="0.25" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="270,340 335,340 400,540" fill="url(#goldV)" fill-opacity="0.32" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="335,340 400,340 400,540" fill="url(#goldV)" fill-opacity="0.62" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="400,340 465,340 400,540" fill="url(#goldV)" fill-opacity="0.2" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="465,340 530,340 400,540" fill="url(#goldV)" fill-opacity="0.45" stroke="url(#gold)" stroke-width="1.6" stroke-linejoin="round"/><polygon points="340,270 460,270 400,250" fill="none"/></g>
<path class="sp twinkle" d="M560 226 Q560 240 574 240 Q560 240 560 254 Q560 240 546 240 Q560 240 560 226Z"/><path class="sp twinkle" d="M240 241 Q240 250 249 250 Q240 250 240 259 Q240 250 231 250 Q240 250 240 241Z"/><path class="sp twinkle" d="M610 510 Q610 520 620 520 Q610 520 610 530 Q610 520 600 520 Q610 520 610 510Z"/><path class="sp twinkle" d="M200 463 Q200 470 207 470 Q200 470 200 477 Q200 470 193 470 Q200 470 200 463Z"/><path class="sp twinkle" d="M470 174 Q470 180 476 180 Q470 180 470 186 Q470 180 464 180 Q470 180 470 174Z"/>

</svg>
