<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Golden crown at the centre of an orbit of six digital service icons">
<title>Golden crown at the centre of an orbit of six digital service icons</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1c17"/><stop offset="1" stop-color="#0c0b0a"/></linearGradient>
<linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="900"><stop offset="0" stop-color="#f4e8c8"/><stop offset=".45" stop-color="#d2b980"/><stop offset="1" stop-color="#8d6f44"/></linearGradient>
<linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e2bb"/><stop offset="1" stop-color="#9c7b4b"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2eee6" stop-opacity=".1"/><stop offset="1" stop-color="#f2eee6" stop-opacity=".02"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2620"/><stop offset="1" stop-color="#0e0d0c"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#d9c08a" stop-opacity=".42"/><stop offset=".55" stop-color="#c9b17d" stop-opacity=".1"/><stop offset="1" stop-color="#c9b17d" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#f2eee6" fill-opacity=".07"/></pattern>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<style>
.g{fill:none;stroke:url(#gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.t{stroke-width:1.2;opacity:.5}
.p{fill:url(#glass);stroke:url(#gold);stroke-opacity:.6;stroke-width:1.4}
.d{fill:#141310;stroke:url(#gold);stroke-opacity:.7;stroke-width:1.4}
.gf{fill:url(#gold)}
.i{fill:#f2eee6}
.sp{fill:#f1e2bb}
.serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;fill:url(#gold)}
.float{animation:float 6s ease-in-out infinite}
.float2{animation:float 7s ease-in-out -2.5s infinite}
.spin{transform-box:view-box;animation:spin 60s linear infinite}
.spinr{transform-box:view-box;animation:spin 90s linear reverse infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3.2s ease-in-out infinite}
.twinkle:nth-of-type(2n){animation-delay:-1.4s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
.pulse.b{animation-delay:-.9s}.pulse.c{animation-delay:-1.8s}
.draw{stroke-dasharray:1400;stroke-dashoffset:0;animation:draw 3.2s cubic-bezier(.2,.7,.2,1) .4s backwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.25)}}
@keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#dots)"/>
<circle cx="1170" cy="450" r="480" fill="url(#glow)" opacity="1"/>

<path d="M0 760 C 400 700, 700 820, 1600 640" class="g t" opacity=".25"/>
<path d="M0 820 C 500 760, 900 860, 1600 720" class="g t" opacity=".15"/>
<g class="spin" style="transform-origin:1170px 450px"><circle cx="1170" cy="450" r="340" class="g t" stroke-dasharray="2 12"/><circle cx="1510" cy="450" r="6" class="gf"/></g>
<circle cx="1170" cy="450" r="260" class="g t"/>
<circle cx="1170" cy="450" r="150" class="g t" stroke-dasharray="1 8"/>
<circle cx="1170" cy="450" r="110" class="d" filter="url(#shadow)"/>
<path d="M1110 470 L1095 400 L1135 430 L1170 380 L1205 430 L1245 400 L1230 470 Z" fill="url(#goldV)" fill-opacity=".35" stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round"/><rect x="1108" y="480" width="124" height="14" rx="4" class="gf"/><circle cx="1170" cy="372" r="7" class="gf"/><circle cx="1095" cy="394" r="5" class="gf"/><circle cx="1245" cy="394" r="5" class="gf"/>
<g transform="translate(1170.0 190.0)"><circle r="38" class="d" filter="url(#shadow)"/><path d="M0 10 C0 10 -12 -2 -12 -8 A12 12 0 1 1 12 -8 C12 -2 0 10 0 10Z" class="g" stroke-width="2"/><circle cx="0" cy="-8" r="4" class="gf"/></g><g transform="translate(1395.2 320.0)"><circle r="38" class="d" filter="url(#shadow)"/><ellipse rx="15" ry="6" class="g" stroke-width="2"/><circle r="5" class="gf"/></g><g transform="translate(1395.2 580.0)"><circle r="38" class="d" filter="url(#shadow)"/><rect x="-14" y="-9" width="28" height="18" rx="3" class="g" stroke-width="2"/><rect x="-9" y="-4" width="7" height="6" rx="1" class="gf"/></g><g transform="translate(1170.0 710.0)"><circle r="38" class="d" filter="url(#shadow)"/><path d="M0 -14 L7 0 L0 14 L-7 0Z" class="g" stroke-width="2"/><circle cy="0" r="2.5" class="gf"/></g><g transform="translate(944.8 580.0)"><circle r="38" class="d" filter="url(#shadow)"/><rect x="-15" y="-11" width="30" height="22" rx="3" class="g" stroke-width="2"/><path d="M-15 -4 H15" class="g" stroke-width="2"/></g><g transform="translate(944.8 320.0)"><circle r="38" class="d" filter="url(#shadow)"/><circle cx="-3" cy="-3" r="9" class="g" stroke-width="2"/><path d="M4 4 L11 11" class="g" stroke-width="3"/></g>
<path class="sp twinkle" d="M1460 156 Q1460 170 1474 170 Q1460 170 1460 184 Q1460 170 1446 170 Q1460 170 1460 156Z"/><path class="sp twinkle" d="M880 241 Q880 250 889 250 Q880 250 880 259 Q880 250 871 250 Q880 250 880 241Z"/><path class="sp twinkle" d="M1480 730 Q1480 740 1490 740 Q1480 740 1480 750 Q1480 740 1470 740 Q1480 740 1480 730Z"/><path class="sp twinkle" d="M940 693 Q940 700 947 700 Q940 700 940 707 Q940 700 933 700 Q940 700 940 693Z"/>

</svg>
